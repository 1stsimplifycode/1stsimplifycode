<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img"><title>Adishree Gupta's seven-stage engineering lifecycle as animated isometric modules</title><desc>Seven animated 3D-looking modules show discover, research, architecture, build, validate, deliver and iterate. Each stage is backed by linked repository evidence beneath the visual.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1229"/><stop offset="1" stop-color="#261b45"/></linearGradient><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="#7cdaf2"/></marker></defs><style><![CDATA[.module{animation:floatin 1.1s ease-out both;animation-delay:var(--delay)}.signal{stroke-dasharray:6 6;animation:trace 2s linear infinite}@keyframes floatin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.module,.signal{animation:none}}]]></style><rect width="1200" height="485" fill="url(#bg)" rx="22"/><g stroke="#304364" opacity=".45"><path d="M0 420l600 -250 600 250M0 465l600 -250 600 250M220 485l380-290 380 290" fill="none"/></g><text x="52" y="52" font-family="Arial" font-size="25" font-weight="bold" fill="#fff">HOW I WORK</text><text x="52" y="81" font-family="monospace" font-size="15" fill="#89dbea">PROBLEM → ENGINEERING → EVIDENCE → IMPACT</text><path class="signal" d="M310 155h17" stroke="#7cdaf2" stroke-width="3" fill="none" marker-end="url(#tip)"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/></path><path class="signal" d="M585 155h17" stroke="#7cdaf2" stroke-width="3" fill="none" marker-end="url(#tip)"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/></path><path class="signal" d="M860 155h17" stroke="#7cdaf2" stroke-width="3" fill="none" marker-end="url(#tip)"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/></path><path class="signal" d="M310 335h17" stroke="#7cdaf2" stroke-width="3" fill="none" marker-end="url(#tip)"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/></path><path class="signal" d="M585 335h17" stroke="#7cdaf2" stroke-width="3" fill="none" marker-end="url(#tip)"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.4s" repeatCount="indefinite"/></path><g class="module" style="--delay:0s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="0s" repeatCount="indefinite"/><path d="M81 102l101 -27 120 32 -99 26Z" fill="#203251" stroke="#4de1ef" stroke-width="2"/><path d="M81 102v95l122 34V128Z" fill="#13223d" stroke="#4de1ef" stroke-width="2"/><path d="M203 128l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#4de1ef" stroke-width="2"/><path d="M81 102l101 -27 120 32 -99 26Z" fill="#4de1ef" opacity=".1"/><text x="93" y="142" font-size="16" font-family="monospace" fill="#4de1ef">01</text><text x="93" y="170" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">DISCOVER</text><text x="93" y="194" font-size="12" font-family="Arial" fill="#bed0ec">User problem</text></g><g class="module" style="--delay:0.35s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="0.55s" repeatCount="indefinite"/><path d="M356 102l101 -27 120 32 -99 26Z" fill="#203251" stroke="#a78bff" stroke-width="2"/><path d="M356 102v95l122 34V128Z" fill="#13223d" stroke="#a78bff" stroke-width="2"/><path d="M478 128l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#a78bff" stroke-width="2"/><path d="M356 102l101 -27 120 32 -99 26Z" fill="#a78bff" opacity=".1"/><text x="368" y="142" font-size="16" font-family="monospace" fill="#a78bff">02</text><text x="368" y="170" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">RESEARCH</text><text x="368" y="194" font-size="12" font-family="Arial" fill="#bed0ec">Data + evidence</text></g><g class="module" style="--delay:0.7s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="1.1s" repeatCount="indefinite"/><path d="M631 102l101 -27 120 32 -99 26Z" fill="#203251" stroke="#64dfbb" stroke-width="2"/><path d="M631 102v95l122 34V128Z" fill="#13223d" stroke="#64dfbb" stroke-width="2"/><path d="M753 128l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#64dfbb" stroke-width="2"/><path d="M631 102l101 -27 120 32 -99 26Z" fill="#64dfbb" opacity=".1"/><text x="643" y="142" font-size="16" font-family="monospace" fill="#64dfbb">03</text><text x="643" y="170" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">ARCHITECT</text><text x="643" y="194" font-size="12" font-family="Arial" fill="#bed0ec">Interfaces + design</text></g><g class="module" style="--delay:1.0499999999999998s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="1.6500000000000001s" repeatCount="indefinite"/><path d="M906 102l101 -27 120 32 -99 26Z" fill="#203251" stroke="#fac67f" stroke-width="2"/><path d="M906 102v95l122 34V128Z" fill="#13223d" stroke="#fac67f" stroke-width="2"/><path d="M1028 128l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#fac67f" stroke-width="2"/><path d="M906 102l101 -27 120 32 -99 26Z" fill="#fac67f" opacity=".1"/><text x="918" y="142" font-size="16" font-family="monospace" fill="#fac67f">04</text><text x="918" y="170" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">BUILD</text><text x="918" y="194" font-size="12" font-family="Arial" fill="#bed0ec">Code + models</text></g><g class="module" style="--delay:1.4s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="2.2s" repeatCount="indefinite"/><path d="M81 282l101 -27 120 32 -99 26Z" fill="#203251" stroke="#f48fad" stroke-width="2"/><path d="M81 282v95l122 34V308Z" fill="#13223d" stroke="#f48fad" stroke-width="2"/><path d="M203 308l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#f48fad" stroke-width="2"/><path d="M81 282l101 -27 120 32 -99 26Z" fill="#f48fad" opacity=".1"/><text x="93" y="322" font-size="16" font-family="monospace" fill="#f48fad">05</text><text x="93" y="350" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">VALIDATE</text><text x="93" y="374" font-size="12" font-family="Arial" fill="#bed0ec">Tests + metrics</text></g><g class="module" style="--delay:1.75s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="2.75s" repeatCount="indefinite"/><path d="M356 282l101 -27 120 32 -99 26Z" fill="#203251" stroke="#7bbbff" stroke-width="2"/><path d="M356 282v95l122 34V308Z" fill="#13223d" stroke="#7bbbff" stroke-width="2"/><path d="M478 308l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#7bbbff" stroke-width="2"/><path d="M356 282l101 -27 120 32 -99 26Z" fill="#7bbbff" opacity=".1"/><text x="368" y="322" font-size="16" font-family="monospace" fill="#7bbbff">06</text><text x="368" y="350" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">DELIVER</text><text x="368" y="374" font-size="12" font-family="Arial" fill="#bed0ec">UX + operations</text></g><g class="module" style="--delay:2.0999999999999996s"><animate attributeName="opacity" values=".35;1;.35" dur="4s" begin="3.3000000000000003s" repeatCount="indefinite"/><path d="M631 282l101 -27 120 32 -99 26Z" fill="#203251" stroke="#d8a6ff" stroke-width="2"/><path d="M631 282v95l122 34V308Z" fill="#13223d" stroke="#d8a6ff" stroke-width="2"/><path d="M753 308l99 -25v95l-99 27Z" fill="#1d2e4c" stroke="#d8a6ff" stroke-width="2"/><path d="M631 282l101 -27 120 32 -99 26Z" fill="#d8a6ff" opacity=".1"/><text x="643" y="322" font-size="16" font-family="monospace" fill="#d8a6ff">07</text><text x="643" y="350" font-size="19" font-family="Arial" font-weight="bold" fill="#fff">ITERATE</text><text x="643" y="374" font-size="12" font-family="Arial" fill="#bed0ec">Feedback + learning</text></g><text x="900" y="455" font-family="monospace" font-size="13" fill="#95bee8">REPEAT THE LOOP ↻</text></svg>