<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" role="img"><title>Typing animation of Adishree Gupta's disciplines</title><desc>Animated typing shows engineering areas across industries. Text may display statically when motion is disabled.</desc><rect width="1200" height="132" rx="17" fill="#111b35"/><rect x="10" y="10" width="1180" height="112" rx="11" stroke="#5fdef3" fill="none"/><text x="40" y="32" font-family="monospace" fill="#82eafa" font-size="16">ADISHREE / ENGINEERING SYSTEMS</text><text x="600" y="82" font-family="monospace" font-weight="bold" text-anchor="middle" font-size="26" fill="#e9fbff">SOFTWARE ENGINEERING</text><g opacity="0"><set attributeName="opacity" to="1" begin="0s" dur="4s"/><text x="600" y="82" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#e8fbff">SOFTWARE ENGINEERING</text><rect x="270" y="50" width="660" height="41" fill="#111b35"><animate attributeName="width" values="660;0;0;660" keyTimes="0;.7;.87;1" dur="4s" begin="0s" repeatCount="indefinite"/></rect></g><g opacity="0"><set attributeName="opacity" to="1" begin="4s" dur="4s"/><text x="600" y="82" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#e8fbff">FULL-STACK DEVELOPMENT</text><rect x="270" y="50" width="660" height="41" fill="#111b35"><animate attributeName="width" values="660;0;0;660" keyTimes="0;.7;.87;1" dur="4s" begin="4s" repeatCount="indefinite"/></rect></g><g opacity="0"><set attributeName="opacity" to="1" begin="8s" dur="4s"/><text x="600" y="82" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#e8fbff">AI + MACHINE LEARNING</text><rect x="270" y="50" width="660" height="41" fill="#111b35"><animate attributeName="width" values="660;0;0;660" keyTimes="0;.7;.87;1" dur="4s" begin="8s" repeatCount="indefinite"/></rect></g><g opacity="0"><set attributeName="opacity" to="1" begin="12s" dur="4s"/><text x="600" y="82" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#e8fbff">SECURITY + SYSTEMS RESEARCH</text><rect x="270" y="50" width="660" height="41" fill="#111b35"><animate attributeName="width" values="660;0;0;660" keyTimes="0;.7;.87;1" dur="4s" begin="12s" repeatCount="indefinite"/></rect></g><g opacity="0"><set attributeName="opacity" to="1" begin="16s" dur="4s"/><text x="600" y="82" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#e8fbff">PRODUCTS ACROSS DOMAINS</text><rect x="270" y="50" width="660" height="41" fill="#111b35"><animate attributeName="width" values="660;0;0;660" keyTimes="0;.7;.87;1" dur="4s" begin="16s" repeatCount="indefinite"/></rect></g><path d="M976 56v29" stroke="#64e6fb" stroke-width="5"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></path><text x="40" y="114" font-family="monospace" fill="#9dbbdc" font-size="12">ENGINEERING ACROSS ROLES AND DOMAINS</text></svg>