<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" role="img"><title>Animated typing identity</title><desc>Cycles through software engineering, full stack, AI and machine learning research, cybersecurity and product-focused engineering. Static label is provided for reduced motion.</desc><style><![CDATA[.p{opacity:0;animation:show 20s steps(1,end) infinite}.p0{animation-delay:0s}.p1{animation-delay:4s}.p2{animation-delay:8s}.p3{animation-delay:12s}.p4{animation-delay:16s}.cursor{animation:blink .75s step-end infinite}@keyframes show{0%,19.9%{opacity:1}20%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.p{animation:none;opacity:0}.p0{opacity:1}.cursor{animation:none}}]]></style><rect width="1200" height="130" rx="20" fill="#10172f"/><rect x="13" y="13" width="1174" height="104" rx="12" fill="none" stroke="#5bd9e9" opacity=".7"/><text x="45" y="42" font-family="monospace" font-size="17" fill="#89d7ed">ADISHREE.GUPTA / ROLE TERMINAL</text><text x="600" y="76" text-anchor="middle" class="p p0" font-size="27" fill="#eaf8ff" font-family="Arial, sans-serif" font-weight="bold">SOFTWARE ENGINEER</text><text x="600" y="76" text-anchor="middle" class="p p1" font-size="27" fill="#eaf8ff" font-family="Arial, sans-serif" font-weight="bold">FULL-STACK BUILDER</text><text x="600" y="76" text-anchor="middle" class="p p2" font-size="27" fill="#eaf8ff" font-family="Arial, sans-serif" font-weight="bold">AI / ML RESEARCHER</text><text x="600" y="76" text-anchor="middle" class="p p3" font-size="27" fill="#eaf8ff" font-family="Arial, sans-serif" font-weight="bold">CYBERSECURITY + DATA</text><text x="600" y="76" text-anchor="middle" class="p p4" font-size="27" fill="#eaf8ff" font-family="Arial, sans-serif" font-weight="bold">PRODUCT-FOCUSED ENGINEER</text><rect class="cursor" x="1080" y="56" width="13" height="29" fill="#62e8fb"/><text x="48" y="107" font-family="monospace" font-size="13" fill="#809ac4">EXPLORE THE INTERACTIVE ROLE PATHWAYS BELOW</text></svg>