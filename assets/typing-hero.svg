<text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#eafaff" opacity="0">CYBERSECURITY + RESEARCH<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="20s" begin="-8s" repeatCount="indefinite"/></text>
<text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#eafaff" opacity="0">BUILDING ACROSS DOMAINS<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="20s" begin="-4s" repeatCount="indefinite"/></text><path d="M1010 62v24" stroke="#64e6fb" stroke-width="4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></path><text x="40" y="115" font-family="Arial, Helvetica, sans-serif" fill="#9dbbdc" font-size="13">ENGINEERING ACROSS ROLES AND DOMAINS</text></svg>