<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc"><title id="title">Engineering disciplines — Adishree Gupta</title><desc id="desc">Five readable engineering disciplines cycle in sequence. No text masking or overlapping layers.</desc><rect width="1200" height="132" rx="17" fill="#111b35"/><rect x="10" y="10" width="1180" height="112" rx="11" stroke="#5fdef3" fill="none"/><text x="40" y="32" font-family="Arial, Helvetica, sans-serif" fill="#82eafa" font-size="16">ADISHREE / ENGINEERING SYSTEMS</text><text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#eafaff" opacity="1">SOFTWARE ENGINEERING<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="20s" begin="0s" repeatCount="indefinite"/></text>
<text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#eafaff" opacity="0">FULL-STACK DEVELOPMENT<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="20s" begin="-16s" repeatCount="indefinite"/></text>
