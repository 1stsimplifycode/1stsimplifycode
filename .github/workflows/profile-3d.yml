name: Generate profile 3D contributions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate 3D contribution images
        uses: offensive-vk/auto-contributions@v7-beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit only generated SVGs
        run: |
          if [ ! -d profile-3d-contrib ]; then
            echo "Expected profile-3d-contrib directory not produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/*.svg
          if git diff --cached --quiet; then
            echo "No generated SVG changes"
            exit 0
          fi
          git commit -m "Generate 3D contribution calendar"
          git push
